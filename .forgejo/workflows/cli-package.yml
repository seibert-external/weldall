name: CLI package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - ci-v*

jobs:
  verify-and-publish:
    runs-on: docker
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared OAuth package
        run: pnpm --filter @weldall/oauth build

      - name: Verify CLI source
        run: |
          pnpm --filter @weldall/ci typecheck
          pnpm --filter @weldall/ci test

      - name: Build and verify npm package
        run: |
          pnpm --filter @weldall/ci build
          pnpm --filter @weldall/ci pack:check

      - name: Verify release tag
        if: startsWith(forgejo.ref, 'refs/tags/ci-v')
        run: |
          VERSION="$(node --print "require('./apps/cli/package.json').version")"
          TAG="${FORGEJO_REF#refs/tags/}"
          test "$TAG" = "ci-v$VERSION" || {
            echo "Release tag $TAG does not match @weldall/ci@$VERSION" >&2
            exit 1
          }
          test "$(pnpm change status)" = "No pending changes." || {
            echo "Apply and commit all pending pnpm change intents before tagging" >&2
            exit 1
          }

      - name: Publish to npm
        if: startsWith(forgejo.ref, 'refs/tags/ci-v')
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || {
            echo "The protected NPM_TOKEN secret is not configured" >&2
            exit 1
          }
          npm publish --ignore-scripts --access public
