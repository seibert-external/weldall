name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: weldall
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate test configuration
        run: pnpm secrets:generate > .env

      - name: Prepare test database
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed:development

      - name: Verify source
        run: |
          pnpm format:check
          pnpm check
          pnpm typecheck
          pnpm test

      - name: Build workspaces
        run: pnpm build:dev

      - name: Verify publishable packages
        run: |
          pnpm --filter @weldall/sdk pack:check
          pnpm --filter @weldall/cli pack:check

  package-compat:
    runs-on: weldall
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify packages on minimum supported Node.js
        run: |
          pnpm --filter @weldall/sdk typecheck
          pnpm --filter @weldall/sdk test
          pnpm --filter @weldall/sdk pack:check
          pnpm --filter @weldall/cli typecheck
          pnpm --filter @weldall/cli test
          pnpm --filter @weldall/cli pack:check

  # Exercise the published artifact outside the monorepo without optional native dependencies.
  packed-cli:
    name: Packed CLI (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Pack CLI
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @weldall/cli build
          pnpm --filter @weldall/cli pack --pack-destination "$RUNNER_TEMP"
      - name: Smoke-test IaC startup
        run: |
          mkdir "$RUNNER_TEMP/weldall-cli-smoke"
          cd "$RUNNER_TEMP/weldall-cli-smoke"
          npm init -y
          npm install --omit=optional "$RUNNER_TEMP"/weldall-cli-*.tgz
          ./node_modules/.bin/weldall validate --help
          ./node_modules/.bin/weldall plan --help
          ./node_modules/.bin/weldall state --help

  e2e:
    needs: verify
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: weldall
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Docker and Playwright E2E tests
        env:
          KEEP_E2E_ARTIFACTS: "1"
        run: bash scripts/test-e2e.sh

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: apps/e2e/test-results
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - package-compat
      - packed-cli
      - e2e
    runs-on: weldall
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages without credentials
        run: |
          pnpm --filter @weldall/sdk pack:check
          pnpm --filter @weldall/cli pack:check

      - name: Create release pull request or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          title: "chore: release packages"
          commit: "chore: release packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          NPM_CONFIG_IGNORE_SCRIPTS: true
