name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Supersede older PR runs without interrupting main's validation or publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-sdk:
    name: Python SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm for interoperability tests
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js for interoperability tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Node.js interoperability dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/python-sdk/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Lint, typecheck, and test
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src tests/typing
          uv run pytest
      - name: Build and inspect distributions
        run: |
          cmp LICENSE ../../LICENSE
          rm -rf "$RUNNER_TEMP/python-sdk-dist"
          uv build --out-dir "$RUNNER_TEMP/python-sdk-dist"
          uv run twine check "$RUNNER_TEMP/python-sdk-dist"/*
          uv run python scripts/verify-package.py "$RUNNER_TEMP/python-sdk-dist"/*
          WHEEL="$(find "$RUNNER_TEMP/python-sdk-dist" -maxdepth 1 -name '*.whl' -print -quit)"
          uv venv "$RUNNER_TEMP/python-sdk-smoke"
          uv pip install --python "$RUNNER_TEMP/python-sdk-smoke/bin/python" "${WHEEL}[fastapi,django]"
          (cd "$RUNNER_TEMP" && PYTHONPATH= "$RUNNER_TEMP/python-sdk-smoke/bin/python" -c 'from importlib.metadata import version; from weldall import __version__, init_weldall; from weldall.adapters.fastapi import FastAPIWeldall; from weldall.adapters.django import DjangoWeldall; assert __version__ == version("weldall-sdk"); print(init_weldall, FastAPIWeldall, DjangoWeldall)')
      - name: Assert validation left no repository debris
        working-directory: .
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  verify:
    runs-on: weldall
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate test configuration
        run: pnpm secrets:generate > .env

      - name: Prepare test database
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed:development

      - name: Verify source
        run: |
          pnpm format:check
          pnpm check
          pnpm typecheck
          pnpm test

      - name: Verify discovery proxy image
        run: pnpm --filter @weldall/discovery-proxy image:test

      - name: Build workspaces
        run: pnpm build:dev

      - name: Verify publishable packages
        run: |
          pnpm --filter @weldall/sdk pack:check
          pnpm --filter @weldall/cli pack:check

  package-compat:
    runs-on: weldall
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keep the minimum-Node SDK gate without multiplying the monorepo suite;
      # the native CLI source matrix below owns minimum-Node CLI verification.
      - name: Verify SDK on minimum supported Node.js
        run: |
          pnpm --filter @weldall/sdk typecheck
          pnpm --filter @weldall/sdk test
          pnpm --filter @weldall/sdk pack:check

  cli-native:
    # Share setup across source, packed npm, and standalone checks on each platform.
    # Keep runner labels hard-coded here; build scripts validate them against the target descriptor.
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            executable: weldall
            archive_extension: tar.gz
          - runner: windows-latest
            target: windows-x64
            executable: weldall.exe
            archive_extension: zip
          - runner: macos-15
            target: darwin-arm64
            executable: weldall
            archive_extension: tar.gz
          - runner: macos-15-intel
            target: darwin-x64
            executable: weldall
            archive_extension: tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      WELDALL_RUNNER_LABEL: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Set up Bun from the repository pin
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI workspace dependencies
        run: pnpm --filter @weldall/sdk build
      - name: Typecheck and test complete CLI source suite
        run: |
          pnpm --filter @weldall/cli typecheck
          pnpm --filter @weldall/cli test
      - name: Build and verify npm package
        run: pnpm --filter @weldall/cli pack:check
      - name: Verify generated production notices
        run: node apps/cli/scripts/generate-third-party-notices.mjs --check
      - name: Assert packaging did not change or pollute the repository
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          node apps/cli/scripts/assert-no-package-debris.mjs
      - name: Provision Linux Secret Service and D-Bus
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 gnome-keyring
      - name: Smoke actual packed npm artifact on Linux
        if: matrix.target == 'linux-x64'
        run: |
          dbus-run-session -- bash -euxo pipefail -c '
            printf "ci-keyring-password" | gnome-keyring-daemon --unlock
            gnome-keyring-daemon --start --components=secrets
            busctl --user list
            pnpm --filter @weldall/cli smoke:packed
          '
      - name: Smoke actual packed npm artifact
        if: matrix.target != 'linux-x64'
        run: pnpm --filter @weldall/cli smoke:packed
      - name: Assert packed smoke left no repository debris
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          node apps/cli/scripts/assert-no-package-debris.mjs
      - name: Build native standalone into runner.temp
        run: |
          OUTPUT_DIR="$RUNNER_TEMP/weldall-standalone" ARCHIVE_DIR="$RUNNER_TEMP/weldall-archive" node -e 'const fs = require("node:fs"); for (const path of [process.env.OUTPUT_DIR, process.env.ARCHIVE_DIR]) { fs.rmSync(path, { recursive: true, force: true }); fs.mkdirSync(path, { recursive: true }); }'
          bun apps/cli/scripts/build-standalone.mjs --target "${{ matrix.target }}" --output-dir "$RUNNER_TEMP/weldall-standalone"
      - name: Smoke copied standalone on Linux with secure-store diagnostics
        if: matrix.target == 'linux-x64'
        run: |
          dbus-run-session -- bash -euxo pipefail -c '
            printf "ci-keyring-password" | gnome-keyring-daemon --unlock
            gnome-keyring-daemon --start --components=secrets
            busctl --user list
            node apps/cli/scripts/smoke-standalone.mjs --target "${{ matrix.target }}" --executable "$RUNNER_TEMP/weldall-standalone/weldall"
          '
      - name: Smoke copied standalone with file, architecture, secure-store, and system-CA diagnostics
        if: matrix.target != 'linux-x64'
        run: node apps/cli/scripts/smoke-standalone.mjs --target "${{ matrix.target }}" --executable "$RUNNER_TEMP/weldall-standalone/${{ matrix.executable }}"
      - name: Create, extract, checksum, and verify native archive
        run: |
          VERSION="$(node -p "require('./apps/cli/package.json').version")"
          ARCHIVE="weldall-v${VERSION}-${{ matrix.target }}.${{ matrix.archive_extension }}"
          node apps/cli/scripts/create-standalone-archive.mjs --target "${{ matrix.target }}" --version "$VERSION" --executable "$RUNNER_TEMP/weldall-standalone/${{ matrix.executable }}" --output-dir "$RUNNER_TEMP/weldall-archive"
          node apps/cli/scripts/checksums.mjs create --output "$RUNNER_TEMP/weldall-archive/SHA256SUMS" "$RUNNER_TEMP/weldall-archive/$ARCHIVE"
          node apps/cli/scripts/checksums.mjs verify "$RUNNER_TEMP/weldall-archive/SHA256SUMS"
      - name: Assert standalone packaging left no repository debris
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          node apps/cli/scripts/assert-no-package-debris.mjs
      - name: Upload the raw standalone executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-standalone-executable-${{ matrix.target }}
          path: ${{ runner.temp }}/weldall-standalone/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 7

  cli-standalone-detached:
    # This no-checkout matrix is intentionally hard-coded and mirrors the validated target descriptor.
    name: Detached standalone CLI (${{ matrix.target }})
    needs: cli-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            executable: weldall
          - runner: windows-latest
            target: windows-x64
            executable: weldall.exe
          - runner: macos-15
            target: darwin-arm64
            executable: weldall
          - runner: macos-15-intel
            target: darwin-x64
            executable: weldall
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Download only the raw standalone executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-standalone-executable-${{ matrix.target }}
          path: ${{ runner.temp }}/detached-weldall
      - name: Start the executable outside a checkout with Node and Bun absent from PATH
        run: |
          mkdir -p "$RUNNER_TEMP/empty-path" "$RUNNER_TEMP/unrelated-cwd"
          EXECUTABLE="$RUNNER_TEMP/detached-weldall/${{ matrix.executable }}"
          if test "${{ matrix.target }}" != "windows-x64"; then chmod 0755 "$EXECUTABLE"; fi
          cd "$RUNNER_TEMP/unrelated-cwd"
          env PATH="$RUNNER_TEMP/empty-path" "$EXECUTABLE" --version
          env PATH="$RUNNER_TEMP/empty-path" "$EXECUTABLE" --help
          env PATH="$RUNNER_TEMP/empty-path" "$EXECUTABLE" init --help

  e2e:
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: weldall
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run Docker and Playwright E2E tests
        env:
          KEEP_E2E_ARTIFACTS: "1"
        run: bash scripts/test-e2e.sh

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: apps/e2e/test-results/**
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - python-sdk
      - verify
      - package-compat
      - cli-native
      - cli-standalone-detached
    runs-on: weldall
    timeout-minutes: 20
    concurrency:
      group: ci-release-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages without credentials
        run: |
          pnpm --filter @weldall/sdk pack:check
          pnpm --filter @weldall/cli pack:check

      # CLI v3 requires action v2's structured publish output; v1 silently skips releases.
      # Pass the PAT/App token as an input so release.published can start release-cli-assets.yml.
      - name: Create release pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          publish-script: pnpm release
          # changeset version bumps package.json but not pnpm-lock.yaml; refresh
          # the lockfile so version PRs and the subsequent frozen install stay in sync
          version-script: pnpm release:version
          pr-title: "chore: release packages"
          commit-message: "chore: release packages"
          push-with-git-cli: true
          create-github-releases: true
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: true
