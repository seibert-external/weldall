name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact Python SDK release tag (weldall-sdk-vX.Y.Z)
        required: true
        type: string
      target:
        description: Trusted-publishing repository (publish to TestPyPI first)
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: python-sdk-publish-${{ inputs.target }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate immutable Python distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out main for ancestry validation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the explicitly authorized tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, ancestry, and immutable package version
        working-directory: packages/python-sdk
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "weldall-sdk-v$VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - name: Set up pnpm for interoperability tests
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js for interoperability tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install immutable Node.js dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Build and inspect immutable distributions
        working-directory: packages/python-sdk
        run: |
          uv sync --locked --all-extras
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src tests/typing
          uv run pytest
          cmp LICENSE ../../LICENSE
          uv build --out-dir "$RUNNER_TEMP/python-sdk-dist"
          uv run twine check "$RUNNER_TEMP/python-sdk-dist"/*
          uv run python scripts/verify-package.py "$RUNNER_TEMP/python-sdk-dist"/*
          WHEEL="$(find "$RUNNER_TEMP/python-sdk-dist" -maxdepth 1 -name '*.whl' -print -quit)"
          uv venv "$RUNNER_TEMP/python-sdk-smoke"
          uv pip install --python "$RUNNER_TEMP/python-sdk-smoke/bin/python" "${WHEEL}[fastapi,django]"
          (cd "$RUNNER_TEMP" && PYTHONPATH= "$RUNNER_TEMP/python-sdk-smoke/bin/python" -c 'from importlib.metadata import version; from weldall import __version__, init_weldall; from weldall.adapters.fastapi import FastAPIWeldall; from weldall.adapters.django import DjangoWeldall; assert __version__ == version("weldall-sdk"); print(init_weldall, FastAPIWeldall, DjangoWeldall)')
      - name: Assert validation left no repository debris
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdk-distributions
          path: ${{ runner.temp }}/python-sdk-dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish with trusted identity
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdk-distributions
          path: ${{ runner.temp }}/python-sdk-dist
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/python-sdk-dist/
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true
