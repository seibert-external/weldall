name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Verify Coolify API is reachable
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
        run: |
          http_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
            "${COOLIFY_API_URL}/version" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}")

          if [ "$http_code" -ge 400 ] || [ "$http_code" = "000" ]; then
            echo "::error::Coolify API health check returned HTTP ${http_code}"
            exit 1
          fi

          echo "Coolify API is reachable (HTTP ${http_code})"

      - name: Wait for deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          POLL_INTERVAL_SECONDS: "10"
          POLL_TIMEOUT_SECONDS: "1200"
        run: |
          set -u

          started_at=$SECONDS
          elapsed=0
          latest_uuid=""
          latest_status="not_found"

          echo "Waiting up to ${POLL_TIMEOUT_SECONDS}s for Coolify deployment ${GITHUB_SHA:0:7}..."

          while [ "$elapsed" -lt "$POLL_TIMEOUT_SECONDS" ]; do
            deployments=$(curl -fsS \
              "${COOLIFY_API_URL}/deployments/applications/${COOLIFY_APP_UUID}?take=100" \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" || true)

            deployment_uuid=""
            if [ -n "$deployments" ]; then
              deployment_uuid=$(jq -r --arg sha "$GITHUB_SHA" \
                '[.deployments[] | select(.commit == $sha)] | sort_by(.created_at) | last | .deployment_uuid // empty' \
                <<<"$deployments" 2>/dev/null || true)
            fi

            if [ -z "$deployment_uuid" ]; then
              latest_status="not_found"
              echo "[${elapsed}s] Waiting for deployment to appear..."
            else
              if [ "$deployment_uuid" != "$latest_uuid" ]; then
                latest_uuid="$deployment_uuid"
                echo "[${elapsed}s] Watching deployment ${latest_uuid}"
              fi

              deployment=$(curl -fsS \
                "${COOLIFY_API_URL}/deployments/${latest_uuid}" \
                -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" || true)
              latest_status=$(jq -r '.status // "unknown"' <<<"$deployment" 2>/dev/null || echo "unknown")
              echo "[${elapsed}s] Status: ${latest_status}"

              if [ "$latest_status" = "finished" ]; then
                echo "Deployment finished"
                exit 0
              fi

              # Coolify may retry a failed deployment under a new UUID. Keep
              # polling for that retry instead of failing the check immediately.
              case "$latest_status" in
                failed*|cancelled*|error*)
                  echo "Coolify reported ${latest_status}; waiting for a successful retry..."
                  ;;
              esac
            fi

            sleep "$POLL_INTERVAL_SECONDS"
            elapsed=$((SECONDS - started_at))
          done

          echo "::error::Coolify deployment did not finish within ${POLL_TIMEOUT_SECONDS}s (latest: ${latest_uuid:-none}, status: ${latest_status})"
          exit 1
